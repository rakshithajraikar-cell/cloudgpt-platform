version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudgpt-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cloudgpt_secure_password
      POSTGRES_DB: cloudgpt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudgpt-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:cloudgpt_secure_password@postgres:5432/cloudgpt_db
      - SECRET_KEY=super-secret-production-jwt-cloudgpt-2026
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudgpt-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
